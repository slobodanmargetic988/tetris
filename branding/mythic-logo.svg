  <path d="M72 94 C84 70 104 62 128 76 C152 62 172 70 184 94 C196 88 206 96 208 112 C194 108 180 110 170 120 C176 132 178 146 174 160 C160 148 146 142 128 142 C110 142 96 148 82 160 C78 146 80 132 86 120 C76 110 62 108 48 112 C50 96 60 88 72 94 Z" fill="url(#flare)" stroke="#ffe7cc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="128" y="146" text-anchor="middle" fill="#f8fbff" font-size="44" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-weight="800" letter-spacing="2">TR</text>
  <text x="128" y="210" text-anchor="middle" fill="#f6f8ff" font-size="17" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" letter-spacing="1">Minotaur</text>
