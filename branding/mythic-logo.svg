<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Tetris Minotaur mythic logo</title>
  <desc id="desc">A mythic emblem for Tetris, themed around a Minotaur.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4b1d1d"/>
      <stop offset="100%" stop-color="#8f2b2b"/>
    </linearGradient>
    <linearGradient id="flare" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
